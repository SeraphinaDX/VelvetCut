name: Go build and FFmpeg tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Test editing and media packages
        run: go test -race -count=1 ./editor ./media
      - name: Build Fyne desktop editor
        run: go build ./...
